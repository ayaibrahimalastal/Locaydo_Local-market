name: locaydo_app
description: "Locaydo - سوق إلكتروني محلي لقطاع غزة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI & DESIGN ──────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  pinput: ^5.0.0

  # ── STATE MANAGEMENT ────────────────────────────────────
  provider: ^6.1.1

  # ── IMAGE HANDLING ──────────────────────────────────────
  image_picker: ^1.0.7

  # ── CLOUDINARY (بديل Firebase Storage) ──────────────────
  cloudinary: ^1.1.3
  http: ^1.2.0

  # ── NETWORK & UTILITIES ─────────────────────────────────
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2
  intl: ^0.19.0
  dartz: ^0.10.1
  app_links: ^6.0.0  # ✅ لإدارة الروابط العميقة
  
  # ── SHARING ─────────────────────────────────────────────
  #share_plus: ^10.0.0  # ✅ للمشاركة في التطبيقات الأخرى

  # ── LOCALIZATION ────────────────────────────────────────
  flutter_localizations:
    sdk: flutter

  # ── FIREBASE ────────────────────────────────────────────
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Dubai
      fonts:
        - asset: assets/fonts/Dubai-Light.ttf
          weight: 300
        - asset: assets/fonts/Dubai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Dubai-Medium.ttf
          weight: 500
        - asset: assets/fonts/Dubai-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  remove_alpha_ios: true